box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--cream);font:400 1rem/1.5 'Barlow',Helvetica,Arial,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg2);z-index:40}
.mk{display:inline-block;-webkit-mask:var(--horn) center/contain no-repeat;mask:var(--horn) center/contain no-repeat}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#2f0907e6;backdrop-filter:blur(8px);border-bottom:1px solid #c1613e44}
.top .mk{width:34px;height:30px;background:var(--org)}
.top b{font:400 1.25rem 'Archivo Black',sans-serif;letter-spacing:.06em;margin-left:10px}
.brand{display:flex;align-items:center}
#cb{position:relative;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ter);background:transparent;color:var(--cream);border-radius:999px;padding:6px 14px 6px 10px;font:600 1rem 'Barlow Condensed',sans-serif;letter-spacing:.08em;cursor:pointer}
#cb .mk{width:28px;height:24px;background:var(--cream)}
#cb.shake{animation:butt .6s}
@keyframes butt{30%{transform:rotate(-14deg) translateX(-6px)}55%{transform:rotate(10deg) translateX(8px) scale(1.12);background:var(--ter)}100%{transform:none}}
.hero{position:relative;overflow:hidden;min-height:calc(100svh - 120px);display:grid;place-items:center;text-align:center;padding:40px 20px 70px;background:radial-gradient(120% 70% at 50% 100%,#c1613e66,transparent 60%),radial-gradient(80% 60% at 50% 20%,#6a1a14,transparent 70%),var(--bg)}
.hw{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transform:translate(calc(var(--px,0)*18px),calc(var(--py,0)*12px + var(--sy,0)*1px));transition:transform .25s ease-out}
.hb{width:min(92vw,560px);aspect-ratio:1;opacity:.5;-webkit-mask:var(--horn) center/contain no-repeat;mask:var(--horn) center/contain no-repeat;background:linear-gradient(105deg,#c1613e55 0 38%,#ffc08a 50%,#c1613e55 62% 100%) 0 0/260% 100%;animation:sheen 4.5s linear infinite}
.hb.charge{animation:sheen 4.5s linear infinite,charge .9s ease}
@keyframes sheen{to{background-position:-260% 0}}
@keyframes charge{25%{transform:scale(.9) rotate(-4deg)}50%{transform:scale(1.28) rotate(3deg);filter:brightness(2.2) drop-shadow(0 0 30px #ff8a3d)}100%{transform:none}}
#em{position:absolute;inset:0;pointer-events:none}
#em span{position:absolute;bottom:-12px;border-radius:50%;background:radial-gradient(#ffd9a0,#ff7a2e 60%,transparent 70%);box-shadow:0 0 10px #ff7a2e;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:1}100%{transform:translate(var(--dx),-105vh) scale(.2);opacity:0}}
.hc{position:relative;z-index:2}
.logo{width:min(86vw,520px);height:auto;display:block;margin:0 auto;cursor:pointer;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both;-webkit-tap-highlight-color:transparent}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(20px)}}
.hc p{margin:18px auto 0;max-width:30ch;font:600 1.15rem 'Barlow Condensed',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--org)}
.hint{font:500 .8rem 'Barlow',sans-serif!important;letter-spacing:.1em!important;opacity:.6;color:var(--cream)!important;margin-top:8px!important}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;text-decoration:none;font:700 1rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:14px 26px;border-radius:4px;background:var(--ter);color:var(--cream);border:2px solid var(--ter);cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn.o{background:transparent;color:var(--cream);border-color:var(--cream)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0006}
.tick{background:var(--ter);color:var(--bg2);overflow:hidden;white-space:nowrap;font:700 1.05rem 'Barlow Condensed',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:11px 0}
.trk{display:inline-block;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.menu{background:var(--cream);color:var(--bg);padding:48px 16px 40px}
.wrap{max-width:900px;margin:0 auto}
h2{font:400 clamp(2rem,9vw,3.2rem)/1 'Archivo Black',sans-serif;margin:0;text-transform:uppercase;text-align:center}
.dv{display:flex;align-items:center;gap:14px;margin:12px 0 22px}
.dv:before,.dv:after{content:"";flex:1;height:2px;background:var(--ter);opacity:.5}
.dv .mk{width:42px;height:38px;background:var(--ter)}
#q{width:100%;font:500 1.05rem 'Barlow',sans-serif;color:var(--bg);background:#f6efe2;border:2px solid #c1613e66;border-radius:4px;padding:13px 16px;outline:0}
#q:focus{border-color:var(--ter)}
#ch{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
#ch button{flex:none;font:700 .95rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;border:2px solid var(--bg);border-radius:999px;background:transparent;color:var(--bg);cursor:pointer}
#ch button.on{background:var(--bg);color:var(--cream)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:6px}
.card{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;background:#f6efe2;border:1.5px solid #c1613e55;border-radius:14px;padding:14px;opacity:0;transform:translateY(20px);transition:opacity .5s var(--d,0ms),transform .5s var(--d,0ms),box-shadow .2s}
.card.in{opacity:1;transform:none;transition:opacity .5s var(--d,0ms),transform .15s,box-shadow .2s}
.card:hover{box-shadow:0 12px 26px #490f0c33;border-color:var(--ter)}
.em{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--bg);box-shadow:inset 0 0 0 3px var(--ter)}
.inf b{display:block;font:400 1.1rem/1.15 'Archivo Black',sans-serif;text-transform:uppercase}
.inf span{font:700 1.3rem 'Barlow Condensed',sans-serif;color:var(--ter)}
.inf i{font-style:normal;font-size:.9rem;opacity:.7;color:var(--bg)}
.add,.qty{grid-column:1/-1}
.add{font:700 1rem 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;border:0;border-radius:4px;background:var(--bg);color:var(--cream);padding:11px;cursor:pointer;transition:background .2s}
.add:hover{background:var(--ter)}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--ter);color:var(--cream);border-radius:4px;padding:4px}
.qty button{width:42px;height:38px;border:0;border-radius:3px;background:var(--bg);color:var(--cream);font-size:1.3rem;cursor:pointer}
.qty span{font:700 1.1rem 'Barlow Condensed',sans-serif;letter-spacing:.06em}
.none{grid-column:1/-1;text-align:center;padding:40px 0;opacity:.7}
.why{padding:56px 16px;background:linear-gradient(180deg,var(--bg2),var(--bg));text-align:center}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:900px;margin:26px auto 0}
.wg div{border:1.5px solid #c1613e66;border-radius:14px;padding:26px 16px;transition:transform .25s,background .25s}
.wg div:hover{transform:translateY(-6px);background:#c1613e22}
.wg em{display:block;font-style:normal;font-size:2.4rem}
.wg b{font:600 1.2rem 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase}
footer{padding:36px 20px 120px;text-align:center;background:var(--bg2);font:500 .9rem 'Barlow',sans-serif;opacity:.95}
footer .mk{width:60px;height:54px;background:var(--org);display:block;margin:0 auto 10px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:35;max-width:700px;margin:0 auto}
#bar .row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cream);color:var(--bg);padding:10px 10px 10px 20px;border-radius:999px;box-shadow:0 8px 28px #0008;font:700 1.05rem 'Barlow Condensed',sans-serif;letter-spacing:.06em}
#bar .row button{font:700 .95rem 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;border:0;border-radius:999px;background:var(--bg);color:var(--cream);padding:11px 20px;cursor:pointer}
#panel{display:none;background:var(--cream);color:var(--bg);border-radius:20px;padding:16px;margin-bottom:8px;max-height:58vh;overflow:auto;box-shadow:0 8px 28px #0008}
#panel.open{display:block}
#panel h3{font:400 1.4rem 'Archivo Black',sans-serif;margin:0 0 8px;text-transform:uppercase}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted #c1613e;font-weight:500}
.wa{display:block;text-align:center;margin-top:14px;background:#1f9d55;border-color:#1f9d55}
.nt{font-size:.82rem;opacity:.7;text-align:center;margin:8px 0 0}
#ta{display:none;width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--ter);padding:8px;font:inherit;min-height:90px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ter);color:var(--cream);padding:9px 18px;border-radius:999px;font:700 .95rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;opacity:0;pointer-events:none;transition:.3s;z-index:45;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#em span,.hb,.trk,.logo{animation:none}.card{opacity:1;transform:none}}
</style>
